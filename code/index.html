<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Visualizador Aritmético WASM - UFRR</title>
    <!-- GSAP para animações fluidas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
  
<body>
<div class="container">
    <h2>Simulador de Aritmética WASM / MIPS</h2>
    <div class="inputs">
        <input type="number" id="numA" value="2147483647" placeholder="Operando A">
        
        <!-- Seleção da Operação -->
        <select id="operacao" onchange="atualizarInterfaceOperacao()">
            <option value="soma">Soma (+)</option>
            <option value="sub">Subtração (-)</option>
            <option value="mul">Multiplicação (*)</option>
        </select>

        <input type="number" id="numB" value="1" placeholder="Operando B">
        <button id="btnCalcular" onclick="executarAnimacao()">Calcular & Animar</button>
    </div>

    <!-- Linhas de Bits -->
    <div class="bit-row" id="row-carry">
        <span class="bit-label" id="label-carry">Carry In / Out (Vai um):</span>
        <div class="bits-grid" id="grid-carry"></div>
    </div>
    <div class="bit-row">
        <span class="bit-label">Operando A (32 bits):</span>
        <div class="bits-grid" id="grid-a"></div>
    </div>
    <div class="bit-row">
        <span class="bit-label">Operando B (32 bits):</span>
        <div class="bits-grid" id="grid-b"></div>
    </div>
    <hr style="border-color: #334155; margin: 15px 0;">
    <div class="bit-row">
        <span class="bit-label" id="label-resultado">Resultado (32 bits):</span>
        <div class="bits-grid" id="grid-res"></div>
    </div>

    <!-- Indicador Visual de Overflow -->
    <div id="overflow-alert">
        🚨 OVERFLOW DETECTADO! O resultado ultrapassou o limite de 32 bits com sinal.
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
